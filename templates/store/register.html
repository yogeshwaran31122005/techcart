{% extends 'base.html' %}
{% block content %}
<section class="section form-layout">
    <div class="form-card">
        <h2>Create account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Register</button>
        </form>
        <p class="helper-text">Already have an account? <a href="{% url 'login' %}">Login</a>.</p>
    </div>
</section>
{% endblock %}
